name: Upstream refresh

# Bumps the pinned Nitro release in content/vars.json and regenerates every file this repo
# derives from an upstream source (precompile tables, contract addresses), then opens a PR
# with whatever changed. Opens nothing when everything is current.
#
# The generators run unconditionally rather than only after a version bump: the precompile
# tables also go stale when a pin in the generator changes or a doc comment is edited
# upstream at the same commit. The contract-address generator is the exception, and runs
# here only as a backstop; see the comment on its step for why it cannot normally change
# anything.
#
# No Go or Rust toolchain is installed. The CLI flags generator reads Nitro's Go source
# rather than running `nitro --help`, precisely so this job stays a plain Node job.
#
# The second job, `stylus`, regenerates the Stylus by Example pages from the third-party repo
# they are republished from, onto its own branch. The third, `drift`, compares this repo's
# content tree against the still-live arbitrum-docs and keeps a single "Upstream drift" issue in
# sync with the result. All three are independent, with no `needs` between them, so a failed
# generator never hides another job's result. `drift` exists only while both sites are live:
# DELETE THE `drift` JOB AT CUTOVER (plan M-52), along with the issue it maintains.

on:
  schedule:
    - cron: '0 8 * * 1' # Mondays, 08:00 UTC
  workflow_dispatch:

concurrency:
  group: upstream-refresh
  cancel-in-progress: false

permissions:
  contents: read # default for any job that does not narrow it

jobs:
  refresh:
    name: Refresh generated content
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the automated/upstream-refresh branch; never writes to main
      pull-requests: write # open the PR for that branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bump the pinned Nitro release
        id: nitro
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm nitro:check-release

      - name: Regenerate precompile tables
        run: pnpm precompiles:generate

      # A backstop, and expected to be a no-op. Unlike the step above this one has no input that
      # moves on its own: the install is --frozen-lockfile, so it reads the same pinned
      # @arbitrum/sdk registry main was generated from, and `contracts:check` blocks every PR, so
      # main is already current with that pin. A Dependabot SDK bump therefore arrives already
      # regenerated, having had to pass that gate. What is left for this step to catch is a hand
      # edit that reached main without the gate, an admin merge or a direct push. No network
      # access, unlike the step above.
      - name: Regenerate contract addresses
        run: pnpm contracts:generate

      # Shallow-clones Nitro at the tag pinned above (plus its go-ethereum submodule, where the
      # execution.rpc.* flags are registered) and parses the flag registrations out of the Go.
      # Runs after the pin bump so a new release is reflected in the same PR.
      - name: Regenerate the Nitro CLI flags reference
        run: pnpm cli:generate

      # zizmor: ignore[superfluous-actions]
      # zizmor suggests `gh pr create`, which would mean hand-rolling the branch/commit/push
      # plumbing and a "did anything change?" check. create-pull-request does all of that and
      # no-ops when the tree is clean, which is the normal outcome of a weekly run.
      - name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/upstream-refresh
          delete-branch: true
          commit-message: 'chore: refresh generated content from upstream'
          title: 'chore: refresh generated content from upstream'
          body: |
            Automated refresh of content generated from upstream sources.

            - `content/vars.json`: pinned Nitro release and node Docker image
            - `content/partials/precompile-tables/`: regenerated from the Solidity
              interfaces and Go implementations at the pinned refs
            - `content/partials/_reference-arbitrum-contract-addresses-partial.mdx`:
              regenerated from the `@arbitrum/sdk` network registry plus
              `scripts/data/contract-addresses.data.mjs`
            - `content/docs/run-a-node/nitro/cli-flags-reference.mdx`: the region between the
              `GENERATED` markers, read from the Nitro source at the pinned tag

            Nitro pin after this run: `${{ steps.nitro.outputs.updated_version || 'unchanged' }}`

            Generated by the `upstream-refresh` workflow. Reproduce locally with
            `pnpm nitro:check-release && pnpm precompiles:generate && pnpm contracts:generate &&
            pnpm cli:generate`.

  # Regenerates content/docs/stylus/stylus-by-example/ from offchainlabs/stylus-by-example, which
  # is a live third-party repository this site republishes. Ported from the `stylus-content` job
  # of arbitrum-docs `update-external-content.yml`, which does not survive that repo being
  # archived; without it those pages freeze and an upstream edit reaches this site through nobody.
  #
  # Its own job, on its own branch, rather than another step in `refresh`, for the reason the
  # `drift` job is independent too: a failure here must not hide a Nitro pin bump, and nineteen
  # pages of changed prose in the same PR as a regenerated address table is a PR nobody reviews.
  # The two need different reviewers anyway — this one is a content change.
  #
  # No pin: stylus-by-example publishes no releases and this site has always tracked its default
  # branch, so the generator clones that. See the header of scripts/generate-stylus-examples.mjs
  # for why `stylus:check` is deliberately not a CI gate.
  stylus:
    name: Refresh Stylus by Example
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the automated/stylus-by-example branch; never writes to main
      pull-requests: write # open the PR for that branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # Needed for Prettier, which is what makes the generated pages byte-stable and `--check`
      # meaningful. The generator itself clones upstream on its own and needs no other dependency.
      - run: pnpm install --frozen-lockfile

      # Also logs the upstream examples this site does not publish, which is the only signal
      # anyone gets that stylus-by-example has added one worth porting.
      - name: Regenerate the Stylus by Example pages
        run: pnpm stylus:generate

      # zizmor: ignore[superfluous-actions]
      # Same reasoning as the `refresh` job: create-pull-request owns the branch/commit/push
      # plumbing and no-ops when nothing changed, which is the normal outcome of a weekly run.
      - name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/stylus-by-example
          delete-branch: true
          commit-message: 'chore: refresh Stylus by Example content from upstream'
          title: 'chore: refresh Stylus by Example content from upstream'
          body: |
            Automated refresh of `content/docs/stylus/stylus-by-example/`, regenerated from
            [offchainlabs/stylus-by-example](https://github.com/offchainlabs/stylus-by-example)
            by the `upstream-refresh` workflow.

            These pages are generated. Review this as a content change to upstream's examples,
            not as an edit to this repo: anything wrong here has to be fixed in
            `offchainlabs/stylus-by-example`, or in
            `scripts/data/stylus-examples.data.mjs` if the published set is what is wrong.

            Reproduce locally with `pnpm stylus:generate`. Check the run log for upstream
            examples this site does not publish — that list is the only notice anyone gets
            that a new example exists.

  # Removed at cutover (plan M-52): once arbitrum-docs is frozen there is nothing to drift from.
  drift:
    name: Report upstream drift
    runs-on: ubuntu-latest
    permissions:
      contents: read # reads this repo only; the upstream clone is public and unauthenticated
      issues: write # maintains the single "Upstream drift" issue
    env:
      # A sibling of the checkout, matching the local layout upstream-drift.mjs expects.
      UPSTREAM_DIR: ${{ github.workspace }}/../arbitrum-docs
      ISSUE_TITLE: Upstream drift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No pnpm and no install: upstream-drift.mjs and everything it reaches
      # (lib/git-freshness.mjs, lib/tree-compare.mjs, lib/upstream-tree.mjs) import only `node:`
      # builtins and each other, so the dependency tree is never touched. `refresh` above is the
      # job that needs the install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # `--filter=blob:none` rather than `--depth 1`: the report labels each absent page DRIFT
      # (added upstream after the port window) or MISS (should have been ported), and it reads
      # that date from `git log --diff-filter=A`. A depth-1 clone has no history, so every
      # absent page would come back MISS and the distinction that makes the report actionable
      # would be gone. A blobless clone keeps the history at roughly the same download size.
      #
      # The explicit `fetch` afterwards is not redundant. scripts/lib/git-freshness.mjs refuses
      # to run against a clone with no `.git/FETCH_HEAD`, on the grounds that a stale baseline
      # under-reports drift rather than failing, and `git clone` alone never writes that file.
      - name: Clone the upstream docs
        run: |
          git clone --filter=blob:none --quiet \
            https://github.com/OffchainLabs/arbitrum-docs.git "$UPSTREAM_DIR"
          git -C "$UPSTREAM_DIR" fetch --quiet origin

      # upstream-drift.mjs exits 1 both when it finds drift and when it refuses to run (missing
      # tree, untrustworthy baseline), so the exit code alone cannot be trusted. A completed run
      # always prints a counts line; anything else is an environment failure and fails the job
      # rather than quietly closing the issue.
      #
      # Match that line anywhere in the report, not at a fixed offset: the script prints a
      # "comparing against <path>" line ahead of it. And keep the stale-allowlist suffix
      # optional, because the script appends ", N stale allowlist" exactly when an exemption has
      # expired, which is the case this job most needs to report rather than choke on.
      - name: Compare the content trees
        id: drift
        run: |
          set +e
          node scripts/upstream-drift.mjs --tree-a "$UPSTREAM_DIR/docs" > drift-report.txt 2> drift-errors.txt
          status=$?
          set -e
          if ! grep -qE '^upstream-drift: [0-9]+ absent, [0-9]+ gutted(, [0-9]+ stale allowlist)?$' drift-report.txt; then
            echo "upstream-drift produced no report (exit $status):"
            cat drift-errors.txt
            exit 1
          fi
          cat drift-report.txt
          if [ "$status" -eq 0 ]; then
            echo 'has_drift=false' >> "$GITHUB_OUTPUT"
          else
            echo 'has_drift=true' >> "$GITHUB_OUTPUT"
          fi

      # zizmor: ignore[superfluous-actions]
      # `gh` is preinstalled on the runner, so this needs no action and no new pinned SHA.
      - name: Open, update, or close the drift issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_DRIFT: ${{ steps.drift.outputs.has_drift }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --repo "$REPO" --state open --search "$ISSUE_TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")

          if [ "$HAS_DRIFT" = 'true' ]; then
            {
              echo "Reported by the \`upstream-refresh\` workflow on $(date -u '+%Y-%m-%d')."
              echo
              echo 'ABSENT is a page that exists upstream with no counterpart here. GUTTED is a page'
              echo 'whose body here is under 70% of the upstream body. DRIFT means the page was added'
              echo 'upstream after the port window closed; MISS means it should already have been ported.'
              echo 'STALE-ALLOWLIST means upstream edited a page whose exemption a human granted against'
              echo 'an older revision: re-read both pages, then either update reviewedUpstreamSha in'
              echo 'scripts/data/upstream.config.json or drop the entry. It is not a porting task.'
              echo
              echo '```'
              # Drop the leading "comparing against <path>" line: on a runner that path is an
              # absolute workspace directory and means nothing to a human reading the issue.
              tail -n +2 drift-report.txt
              echo '```'
              echo
              echo "Reproduce locally with \`pnpm drift --tree-a <arbitrum-docs>/docs\`. [Workflow run]($RUN_URL)"
              echo
              echo 'This issue is maintained automatically: the body is replaced on every run, so do not'
              echo 'edit it. It closes itself when the report comes back empty. Do not close it by hand'
              echo 'either: the next run would open a second one rather than reopening this.'
            } > issue-body.md

            if [ -n "$number" ]; then
              gh issue edit "$number" --repo "$REPO" --body-file issue-body.md
              echo "updated issue #$number"
            else
              gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --body-file issue-body.md
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" \
              --body "No absent or gutted pages as of $(date -u '+%Y-%m-%d'). Closing. [Workflow run]($RUN_URL)"
            gh issue close "$number" --repo "$REPO"
            echo "closed issue #$number"
          else
            echo 'no drift and no open issue; nothing to do'
          fi
