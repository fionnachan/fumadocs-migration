name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check (regenerates .source/, then tsc)
        run: pnpm types:check

      - name: Script test suites
        run: pnpm test

      - name: Global variables resolve
        run: pnpm vars:check

      - name: Navigation integrity
        run: pnpm nav:check

      - name: Partials resolve and stay unrouted
        run: pnpm partials:check

      - name: Archived page registry
        run: node scripts/versioned-docs-check.mjs

      - name: Glossary references resolve
        run: pnpm references:check

      - name: FAQ structured-data ids resolve
        run: pnpm faq:check

      # A markdown image with a remote src renders as a 500: next/image needs a width and
      # source.config.ts no longer measures remote images. Offline, so it is safe to block on.
      - name: No remote markdown images
        run: pnpm images:presence

      # Fumadocs has no `onBrokenLinks: 'throw'`, and `pnpm build` does not check links,
      # so this step is the only thing standing between a broken link and main.
      # Caveat: check-links does not validate anchors — a live page with a dead #anchor passes.
      - name: Internal links
        run: pnpm check-links

      # Blocking, unlike its sibling `precompiles:check`, because this generator is offline and
      # deterministic: it reads the network registry that ships inside `@arbitrum/sdk`, and that
      # pin is exact (`4.1.0`). So this step cannot go red on its own. It goes red on a human act,
      # and each one deserves to block:
      #   1. Someone edited the generated partial by hand, against the do-not-edit marker inside
      #      it. Before this step existed, that passed CI, merged, and was then silently reverted
      #      by the next weekly upstream-refresh run under the automation's authorship.
      #   2. A PR bumped `@arbitrum/sdk` to a release that moves a published address. An address
      #      is what a reader pastes into a transaction, so it must never change unreviewed.
      #   3. A PR bumped one of the other pins the output depends on. Prettier is what aligns the
      #      table columns (the generator emits loose pipes), so a `prettier` or
      #      `@offchainlabs/prettier-config` release that reshapes MDX tables moves every row.
      # None of these reddens an unrelated PR: CI installs from each branch's own lockfile, so only
      # the bumping PR sees the new pin. The fix is the same in all three cases, one command in that
      # PR: `pnpm contracts:generate`, then commit the regenerated partial.
      - name: Generated contract addresses are current
        run: pnpm contracts:check

  content-debt:
    # Non-blocking checks. The first two fail on pre-existing debt; the third needs the network.
    # Each step says below why it reports rather than blocks, and what would promote it.
    # Counts verified against main on 2026-08-31:
    #   format:check      49 files unformatted  → fix with `pnpm format`
    #   content:lint      13 findings across 7 files (breakdown below)
    #
    # content:lint by rule:
    #   A2  invalid admonition type                 7 in  4 files
    #   A5  internal link keeps a .md/.mdx suffix   6 in  3 files
    #
    # A1 (empty admonition body, was 98) and A4 (markdown/entities inside title=, was 68)
    # are now zero. They were one defect, not 166: the Docusaurus→Fumadocs admonition
    # codemod stranded body prose inside `title=`. Recovering it in 0e5a64a took this
    # job from 181 findings to 15.
    #
    # Read the count from the script's own summary line, not by counting printed lines:
    # content:lint groups by rule and truncates each group, which is how this comment
    # previously came to claim 39 findings.
    #
    # references:check reached zero and moved into `gates` on 2026-08-20.
    # check-links reached zero and moved into `gates` on 2026-08-31.
    # Move a step into the `gates` job above once its count reaches zero.
    name: Content debt (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check
        continue-on-error: true

      - name: MDX structural lint
        run: pnpm content:lint
        continue-on-error: true

      # Green today, and non-blocking for a reason the two steps above do not share: this one
      # fetches ~30 Solidity sources from raw.githubusercontent at every run, so a GitHub blip
      # turns it red for reasons unrelated to the change under review. Same argument as `Build`.
      # Its sibling `contracts:check` is offline, which is why that one blocks and this one
      # cannot. Reaching zero is therefore not what would promote this step; losing the network
      # dependency would be.
      - name: Generated precompile tables are current
        run: pnpm precompiles:check
        continue-on-error: true

  build:
    # Still non-blocking, but the original reason no longer holds. This job was left
    # advisory because the MDX image pipeline fetched remote images at build time, so a
    # dead third-party URL turned it red for reasons unrelated to the change under
    # review. FS-2681 set `remarkImageOptions: { external: false }` in source.config.ts,
    # and the build no longer touches the network for images.
    #
    # Promoting this job into `gates` is therefore possible now. It is deliberately left
    # out of that change: a full build is the slowest job here, so flipping it wants its
    # own PR and a look at the added PR latency.
    #
    # It catches MDX compile errors that types:check cannot see.
    name: Build (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
